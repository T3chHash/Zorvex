# =====================================================================
# Zorvex | Network — Nginx virtual host
# Fronts PHP-FPM on :9000 and serves the public/ directory.
# =====================================================================

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/html/public;
    index index.php index.html;

    charset utf-8;

    # --- Error logs ---
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # --- Security headers ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "microphone=(), camera=(), geolocation=()" always;

    # --- Requests limit (webhook flood protection) ---
    limit_req_zone $binary_remote_addr zone=webhook:10m rate=10r/s;

    # --- Static assets: serve directly, cache aggressively ---
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
        access_log off;
    }

    # --- Main application entry ---
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # --- Webhook: stricter rate limit, never cache ---
    location = /webhook {
        limit_req zone=webhook burst=25 nodelay;
        try_files $uri /index.php?$query_string;
    }

    # --- PHP-FPM ---
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass php-fpm:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_param SERVER_NAME $host;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 60;
        add_header X-Powered-By "Zorvex" always;
    }

    # --- Deny dotfiles ---
    location ~ /\. {
        deny all;
        access_log off;
    }

    # --- Deny sensitive paths ---
    location ~ ^/(\.env|composer\.(json|lock)|README\.md|\.git) {
        deny all;
        access_log off;
    }

    # --- Large uploads for receipt photos (mini-app/telegram) ---
    client_max_body_size 32m;
}