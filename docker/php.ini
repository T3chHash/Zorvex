; =====================================================================
; Zorvex | Network — PHP runtime configuration
; =====================================================================

[PHP]
engine = On
short_open_tag = Off
precision = 14
output_buffering = 4096
zlib.output_compression = Off
implicit_flush = Off
serialize_precision = -1

; --- Timezone ---
date.timezone = Asia/Tehran
date.default_latitude = 35.6892
date.default_longitude = 51.3890

; --- Input ---
max_execution_time = 30
max_input_time = 60
memory_limit = 256M
post_max_size = 32M
upload_max_filesize = 32M
max_file_uploads = 20

; --- Errors ---
error_reporting = E_ALL
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
ignore_repeated_errors = On

; --- Extensions ---
extension=pdo_mysql
extension=mbstring
extension=intl
extension=openssl
extension=sockets
extension=zip
; Note: redis is loaded via docker-php-ext-enable (auto-generates its own .ini).
; Note: curl is compiled in and auto-loaded by the official PHP FPM image.

; --- Opcache (FPM) ---
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.revalidate_freq = 2
opcache.validate_timestamps = 1

; --- Sessions (file based is fine for this app) ---
session.save_handler = files
session.use_strict_mode = 1
session.use_cookies = 1
session.cookie_httponly = 1
session.sid_length = 48
session.sid_bits_per_character = 5